version: '3.8'

services:
  backend:
    build: ./mern-demo/server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://<username>:<password>@cluster.mongodb.net/dbname?retryWrites=true&w=majority
      - PORT=5000

  frontend:
    build: ./mern-demo/client
    ports:
      - "3000:3000"
    depends_on:
      - backend